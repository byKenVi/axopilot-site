# Publication planifiée du blogue.
# Les articles sont écrits à l'avance avec une date future et restent cachés
# jusqu'à cette date (voir src/lib.ts). Les matins de publication, cette action
# pousse un commit vide si un article est daté du jour : Netlify reconstruit
# alors le site et l'article apparaît. Gratuit, aucun réglage Netlify requis.
name: Publication planifiée

on:
  schedule:
    - cron: '7 11 * * 2,4' # mardi et jeudi, 11 h 07 UTC (6 h 07 à Montréal en hiver)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Article daté d'aujourd'hui ?
        id: check
        run: |
          today=$(date -u +%F)
          slugs=$(grep -l "^date: ${today}" src/content/blog/*.md 2>/dev/null | xargs -r grep -L "^draft: true" | xargs -r -n1 basename | sed 's/\.md$//' | paste -sd ' ' -)
          echo "slugs=${slugs}" >> "$GITHUB_OUTPUT"
          echo "Articles du ${today} : ${slugs:-aucun}"
      - name: Relancer le site
        if: steps.check.outputs.slugs != '' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "axiopilot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Publication planifiée : ${{ steps.check.outputs.slugs || 'relance manuelle' }}"
          git push
